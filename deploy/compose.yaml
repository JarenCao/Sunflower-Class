# 仅启动基础设施；所有端口只绑定本机，Java微服务按部署说明启动。
services:
  mysql:
    image: mysql:8.0
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:?请配置独立数据库口令}
      TZ: Asia/Shanghai
    command: ['--character-set-server=utf8mb4', '--collation-server=utf8mb4_0900_ai_ci']
    ports: ['127.0.0.1:3306:3306']
    volumes:
      - mysql-data:/var/lib/mysql
      - ../docs/sql/INIT_DATABASES.sql:/docker-entrypoint-initdb.d/01-init.sql:ro
  nacos:
    image: nacos/nacos-server:v2.3.0
    environment:
      MODE: standalone
      NACOS_AUTH_ENABLE: 'true'
      NACOS_AUTH_TOKEN: ${NACOS_AUTH_TOKEN:?请配置32字节以上Base64令牌}
      NACOS_AUTH_IDENTITY_KEY: ${NACOS_AUTH_IDENTITY_KEY:?请配置服务身份键}
      NACOS_AUTH_IDENTITY_VALUE: ${NACOS_AUTH_IDENTITY_VALUE:?请配置服务身份值}
    ports: ['127.0.0.1:8848:8848', '127.0.0.1:9848:9848']
    volumes: ['nacos-data:/home/nacos/data']
  rabbitmq:
    image: rabbitmq:3.13-management-alpine
    environment:
      RABBITMQ_DEFAULT_USER: ${RABBITMQ_USER:?请配置消息用户}
      RABBITMQ_DEFAULT_PASS: ${RABBITMQ_PASSWORD:?请配置消息口令}
      RABBITMQ_DEFAULT_VHOST: sunflower
    ports: ['127.0.0.1:5672:5672', '127.0.0.1:15672:15672']
    volumes: ['rabbit-data:/var/lib/rabbitmq']
  redis:
    image: redis:8.4.2-alpine
    environment:
      REDIS_PASSWORD: ${REDIS_PASSWORD:?请配置缓存口令}
    command: ['sh', '-c', 'exec redis-server --appendonly yes --requirepass "$$REDIS_PASSWORD"']
    ports: ['127.0.0.1:6379:6379']
    volumes: ['redis-data:/data']
  elasticsearch:
    image: docker.elastic.co/elasticsearch/elasticsearch:9.4.2
    environment:
      discovery.type: single-node
      xpack.security.enabled: 'false'
      ES_JAVA_OPTS: -Xms512m -Xmx512m
    ports: ['127.0.0.1:9200:9200']
    volumes: ['es-data:/usr/share/elasticsearch/data']
  minio:
    image: pgsty/silo@sha256:29a498b24669cae1fed11c1a2fb2b3d73c68829a0a9c0b14e71b386671d38fac
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:?请配置对象存储用户}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:?请配置对象存储口令}
    command: ['server', '/data', '--console-address', ':9001']
    ports: ['127.0.0.1:9000:9000', '127.0.0.1:9001:9001']
    volumes: ['minio-data:/data']
volumes:
  mysql-data:
  nacos-data:
  rabbit-data:
  redis-data:
  es-data:
  minio-data:
