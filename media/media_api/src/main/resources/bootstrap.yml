spring:
  application:
    name: media-api
  profiles:
    active: dev
  cloud:
    nacos:
      config:
        enabled: true
        server-addr: 172.24.77.139:8848
        namespace: dev
        group: sunflower_class
        file-extension: yaml
        refresh-enabled: true
        extension-configs:
          - data-id: media-service-${spring.profiles.active}.yaml
            group: sunflower_class
            refresh: true
        shared-configs:
          - data-id: swagger-${spring.profiles.active}.yaml
            group: common
            refresh: true
          - data-id: logging-${spring.profiles.active}.yaml
            group: common
            refresh: true
          - data-id: rabbitmq-${spring.profiles.active}.yaml
            group: common
            refresh: true 
      discovery:
        enabled: true
        server-addr: 172.24.77.139:8848
        namespace: dev
        group: sunflower_class