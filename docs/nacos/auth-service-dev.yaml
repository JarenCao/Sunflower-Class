# dev 命名空间、sunflower_class 分组；真实凭据放在受保护的外部配置中。
server:
  port: 63080
spring:
  datasource:
    url: ${AUTH_DB_URL:jdbc:mysql://localhost:3306/users?useUnicode=true&characterEncoding=UTF-8&serverTimezone=Asia/Shanghai}
    username: ${AUTH_DB_USERNAME}
    password: ${AUTH_DB_PASSWORD}
    driver-class-name: com.mysql.cj.jdbc.Driver
