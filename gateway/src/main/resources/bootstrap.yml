spring:
  application:
    name: gateway
  profiles:
    active: dev
  cloud:
    nacos:
      server-addr: 172.24.77.139:8848
      discovery:
        enabled: true
        namespace: dev
        group: sunflower_class
      config:
        enabled: true
        namespace: dev
        group: sunflower_class
        file-extension: yaml
        refresh-enabled: true
        shared-configs:
          - data-id: logging-${spring.profiles.active}.yaml
            group: common
            refresh: true